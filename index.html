<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E2723" />

    <!-- Primary SEO -->
    <title>AtiSunya Infratech | Real Estate Consultants in Noida &amp; Ghaziabad</title>
    <meta
      name="description"
      content="Buy, sell, rent or invest in verified properties across Noida, Greater Noida and Ghaziabad. Trusted, transparent real estate guidance from AtiSunya Infratech."
    />
    <link rel="canonical" href="https://www.atisunyainfratech.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AtiSunya Infratech" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AtiSunya Infratech" />
    <meta property="og:title" content="AtiSunya Infratech | Real Estate Consultants in Noida & Ghaziabad" />
    <meta
      property="og:description"
      content="Buy, sell, rent or invest in verified properties across Noida, Greater Noida and Ghaziabad. Trusted, transparent real estate guidance."
    />
    <meta property="og:url" content="https://www.atisunyainfratech.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://res.cloudinary.com/dkrjlekne/image/upload/f_auto,q_auto,w_1200,h_630,c_fill/atisunya/hero/hero1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AtiSunya Infratech | Real Estate Consultants in Noida & Ghaziabad" />
    <meta
      name="twitter:description"
      content="Buy, sell, rent or invest in verified properties across Noida, Greater Noida and Ghaziabad."
    />
    <meta name="twitter:image" content="https://res.cloudinary.com/dkrjlekne/image/upload/f_auto,q_auto,w_1200,h_630,c_fill/atisunya/hero/hero1" />

    <!-- Fonts: preconnect + a real <link> (not a CSS @import) so the browser
         can start fetching them immediately instead of discovering the
         request only after index.css finishes parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Structured data: local real estate business -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "AtiSunya Infratech",
        "description": "Real estate consultancy helping buyers, sellers, investors and businesses find residential properties across Noida, Greater Noida and Ghaziabad.",
        "url": "https://www.atisunyainfratech.com/",
        "areaServed": [
          { "@type": "City", "name": "Noida" },
          { "@type": "City", "name": "Greater Noida" },
          { "@type": "City", "name": "Ghaziabad" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Uttar Pradesh",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
